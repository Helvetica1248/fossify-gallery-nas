name: NAS build validation

on:
  pull_request:
    paths:
      - 'app/**/nas/**'
      - 'app/**/Nas*'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - '.github/workflows/nas-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nas-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source snapshot
        run: |
          mkdir -p artifacts/nas-build
          git rev-parse HEAD > artifacts/nas-build/HEAD.txt
          git archive --format=tar HEAD | gzip > artifacts/nas-build/source.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nas-source-snapshot
          path: artifacts/nas-build/
          retention-days: 7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 17
          distribution: temurin
      - uses: FossifyOrg/.github/.github/actions/gradle-cache@main
      - name: Build debug, unsigned R8 release and instrumentation APK
        run: ./gradlew --no-daemon :app:assembleFossDebug :app:assembleFossRelease :app:assembleFossDebugAndroidTest --console=plain
      - name: Record APK digests
        run: find app/build/outputs/apk -name '*.apk' -type f -exec sha256sum {} + > artifacts/nas-build/APK-SHA256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: nas-build-apks
          path: |
            app/build/outputs/apk/**/*.apk
            artifacts/nas-build/HEAD.txt
            artifacts/nas-build/APK-SHA256.txt
          retention-days: 7
